<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape the Angry Teacher</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  text-align: center;
  font-family: Arial, sans-serif;
  background: #202943;
  color: white;
}
h1 { margin: 8px; }
#hud {
  max-width: 800px;
  margin: 15px auto 0;
  padding: 12px;
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 10px;
  background: #fff4d6;
  color: #202943;
  border-radius: 10px 10px 0 0;
  font-weight: bold;
}
#game {
  display: block;
  width: 100%;
  max-width: 800px;
  height: auto;
  margin: auto;
  background: #d9edcc;
  border: 4px solid #fff4d6;
  border-top: 0;
}
#message {
  margin: 15px auto;
  font-size: 18px;
  font-weight: bold;
}
button {
  padding: 12px 22px;
  margin: 5px;
  border: 0;
  border-radius: 8px;
  background: #70e0a1;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>

<h1>🏃 Escape the Angry Teacher</h1>
<p>Collect 5 mobiles and escape without getting caught!</p>

<div id="hud">
  <span id="score">⭐ Score: 0</span>
  <span id="mobiles">📱 Mobiles: 0/5</span>
  <span id="lives">❤️❤️❤️</span>
</div>

<canvas id="game" width="800" height="500"></canvas>

<div id="message">Press Play to start!</div>
<button onclick="startGame()">▶ Play / Restart</button>
<button onclick="togglePause()">⏸ Pause</button>

<p>Move: Arrow keys or WASD | Collect 5 mobiles, then reach the exit!</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;
const keys = {};

let player, teacher, mobiles, desks, exit;
let score = 0;
let lives = 3;
let collected = 0;
let running = false;
let paused = false;
let lastTime = 0;

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function randomPosition() {
  return {
    x: 35 + Math.random() * (W - 70),
    y: 35 + Math.random() * (H - 70)
  };
}

function overlapsDesk(x, y, radius = 14) {
  return desks.some(d =>
    x + radius > d.x &&
    x - radius < d.x + d.w &&
    y + radius > d.y &&
    y - radius < d.y + d.h
  );
}

function safePosition(avoid = []) {
  for (let i = 0; i < 1000; i++) {
    const p = randomPosition();

    if (overlapsDesk(p.x, p.y)) continue;
    if (avoid.some(a => distance(p, a) < 75)) continue;

    return p;
  }

  return { x: W / 2, y: H / 2 };
}

function startGame() {
  score = 0;
  lives = 3;
  collected = 0;
  paused = false;
  running = true;

  desks = [
    { x: 130, y: 80, w: 100, h: 45 },
    { x: 330, y: 65, w: 100, h: 45 },
    { x: 550, y: 100, w: 100, h: 45 },
    { x: 90, y: 220, w: 100, h: 45 },
    { x: 300, y: 230, w: 100, h: 45 },
    { x: 540, y: 260, w: 100, h: 45 },
    { x: 180, y: 380, w: 100, h: 45 },
    { x: 430, y: 390, w: 100, h: 45 }
  ];

  player = { x: 35, y: H - 35, radius: 12 };
  exit = { x: W - 55, y: 25, w: 35, h: 45 };
  teacher = safePosition([player, exit]);

  mobiles = [];

  for (let i = 0; i < 5; i++) {
    mobiles.push({
      ...safePosition([player, teacher, exit, ...mobiles]),
      taken: false
    });
  }

  document.getElementById("message").textContent =
    "Collect all 5 mobiles and find the exit!";

  updateHUD();
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function updateHUD() {
  document.getElementById("score").textContent =
    "⭐ Score: " + score;

  document.getElementById("mobiles").textContent =
    "📱 Mobiles: " + collected + "/5";

  document.getElementById("lives").textContent =
    "❤️".repeat(lives) + "🖤".repeat(3 - lives);
}

function togglePause() {
  if (!running) return;

  paused = !paused;

  document.getElementById("message").textContent =
    paused ? "Game paused. Press Pause to continue." :
    "Collect all 5 mobiles and find the exit!";

  if (!paused) {
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
  }
}

function moveCharacter(character, dx, dy, speed, dt) {
  const nextX = Math.max(
    character.radius,
    Math.min(W - character.radius, character.x + dx * speed * dt)
  );

  if (!overlapsDesk(nextX, character.y, character.radius)) {
    character.x = nextX;
  }

  const nextY = Math.max(
    character.radius,
    Math.min(H - character.radius, character.y + dy * speed * dt)
  );

  if (!overlapsDesk(character.x, nextY, character.radius)) {
    character.y = nextY;
  }
}

function update(dt) {
  if (!running || paused) return;

  let dx = 0;
  let dy = 0;

  if (keys.ArrowLeft || keys.a || keys.A) dx--;
  if (keys.ArrowRight || keys.d || keys.D) dx++;
  if (keys.ArrowUp || keys.w || keys.W) dy--;
  if (keys.ArrowDown || keys.s || keys.S) dy++;

  if (dx || dy) {
    const length = Math.hypot(dx, dy);
    dx /= length;
    dy /= length;
    moveCharacter(player, dx, dy, 155, dt);
  }

  // Teacher follows the student when close enough.
  const d = distance(player, teacher);

  if (d < 260 && d > 1) {
    const tx = (player.x - teacher.x) / d;
    const ty = (player.y - teacher.y) / d;

    moveCharacter(teacher, tx, ty, 175, dt);
  } else if (Math.random() < 0.025) {
    teacher.target = randomPosition();
  }

  // Teacher patrol movement.
  if (teacher.target && d >= 260) {
    const td = distance(teacher, teacher.target);

    if (td > 5) {
      moveCharacter(
        teacher,
        (teacher.target.x - teacher.x) / td,
        (teacher.target.y - teacher.y) / td,
        80,
        dt
      );
    }
  }

  // Collect mobiles.
  for (const mobile of mobiles) {
    if (!mobile.taken && distance(player, mobile) < 24) {
      mobile.taken = true;
      collected++;
      score += 10;
      updateHUD();
    }
  }

  // Getting caught costs one life and sends the player to the start.
  if (distance(player, teacher) < 25) {
    lives--;
    updateHUD();

    if (lives <= 0) {
      running = false;
      document.getElementById("message").textContent =
        "OOPS! GAME OVER — Press Play to try again.";
      return;
    }

    player.x = 35;
    player.y = H - 35;
    teacher.target = randomPosition();
  }

  // Unlock the exit after collecting all five mobiles.
  if (
    collected === 5 &&
    player.x > exit.x - 10 &&
    player.x < exit.x + exit.w + 10 &&
    player.y > exit.y - 10 &&
    player.y < exit.y + exit.h + 10
  ) {
    running = false;
    document.getElementById("message").textContent =
      "🏆 BOOYAH! YOU ESCAPED THE ANGRY TEACHER!";
  }
}

function drawCharacter(x, y, color, label) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, 13, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.font = "bold 12px Arial";
  ctx.textAlign = "center";
  ctx.fillText(label, x, y - 20);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // School floor.
  ctx.fillStyle = "#d9edcc";
  ctx.fillRect(0, 0, W, H);

  // Floor tiles.
  for (let x = 0; x < W; x += 40) {
    for (let y = 0; y < H; y += 40) {
      ctx.strokeStyle = "rgba(60,100,60,0.12)";
      ctx.strokeRect(x, y, 40, 40);
    }
  }

  // Exit.
  ctx.fillStyle = collected === 5 ? "#ffd34d" : "#7c8799";
  ctx.fillRect(exit.x, exit.y, exit.w, exit.h);

  ctx.fillStyle = "#202943";
  ctx.font = "bold 11px Arial";
  ctx.textAlign = "center";
  ctx.fillText(
    collected === 5 ? "OPEN" : "LOCKED",
    exit.x + exit.w / 2,
    exit.y - 6
  );

  // Desks.
  for (const desk of desks) {
    ctx.fillStyle = "#9b6744";
    ctx.fillRect(desk.x, desk.y, desk.w, desk.h);

    ctx.fillStyle = "#c18b5b";
    ctx.fillRect(
      desk.x + 5,
      desk.y + 5,
      desk.w - 10,
      desk.h - 10
    );
  }

  // Mobiles.
  for (const mobile of mobiles) {
    if (mobile.taken) continue;

    ctx.fillStyle = "#28334c";
    ctx.fillRect(mobile.x - 7, mobile.y - 11, 14, 22);

    ctx.fillStyle = "#62e5d1";
    ctx.fillRect(mobile.x - 4, mobile.y - 7, 8, 14);

    ctx.fillStyle = "white";
    ctx.fillRect(mobile.x - 2, mobile.y + 8, 4, 1);
  }

  // Student and teacher.
  drawCharacter(player.x, player.y, "#3378e8", "YOU");
  drawCharacter(teacher.x, teacher.y, "#e83e52", "TEACHER");

  ctx.textAlign = "left";
}

function gameLoop(time) {
  if (!running || paused) return;

  const dt = Math.min((time - lastTime) / 1000, 0.04);
  lastTime = time;

  update(dt);
  draw();

  if (running && !paused) {
    requestAnimationFrame(gameLoop);
  }
}

document.addEventListener("keydown", event => {
  keys[event.key] = true;

  if (
    ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "]
      .includes(event.key)
  ) {
    event.preventDefault();
  }

  if (event.key === "Escape") {
    togglePause();
  }

  if (
    (event.key === "r" || event.key === "R") &&
    !running
  ) {
    startGame();
  }
});

document.addEventListener("keyup", event => {
  keys[event.key] = false;
});

// Draw the opening screen.
desks = [];
player = { x: 35, y: H - 35, radius: 12 };
teacher = { x: W - 80, y: 80, radius: 13 };
mobiles = [];
exit = { x: W - 55, y: 25, w: 35, h: 45 };
draw();
</script>
</body>
</html>
